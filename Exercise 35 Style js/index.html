<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 35: Styling DOM Elements</title>
    <script src="script.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #6200ee;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #3700b3;
        }
        #image {
            transition: all 0.3s ease;
            max-width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Dynamic Image Styler</h2>
        
        <button onclick="changeImage()">Change Image Styles</button>
        
        <br>
        
        <img id="image" src="https://via.placeholder.com/150" alt="Dynamic Target Image">
    </div>

    <script src="script.js"></script>

</body>
</html>
